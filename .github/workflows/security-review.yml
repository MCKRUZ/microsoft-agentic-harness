name: Security Review

# The security rail (the-rails.md §3): the security-reviewer agent, triggered by
# what the diff CONTAINS (see .github/scripts/security-gate-scope.sh), with the
# original gated-path list kept as a supplement.
#
# Design note — why this is a REQUIRED check that runs on EVERY PR:
# A required status check must report a conclusion on every PR or the merge stays
# stuck "pending". So this job runs on all PRs but short-circuits to success when
# nothing security-relevant changed. When it IS relevant (or the `risk:high` label
# is present) it runs the security-reviewer and FAILS on a HIGH finding — that
# failure is what blocks the merge. Add the check name `security-review` to the
# main-branch ruleset's required checks (already done in main-branch-protection.json).
#
# Fail-safe: a gated change whose review cannot complete BLOCKS rather than passes.
# The reviewer writes a PROVISIONAL block as its first action and only overwrites it
# on completion, so "did not finish" is fail-closed by construction. The enforce step
# reports three distinct outcomes — a real finding, an incomplete review, and a
# reviewer that never started — because they need different responses from a human.
# Do not collapse them back into one message: an earlier version blamed a missing
# ANTHROPIC_API_KEY for every empty verdict, and that guess cost real debugging time
# on PR #186 when the actual cause was the reviewer exhausting its turn budget.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: security-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  security-review:
    name: security-review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect security-relevant changes
        id: detect
        env:
          BASE_REF: ${{ github.base_ref }}
          HAS_RISK_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'risk:high') }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          SECURITY_SCOPE_FILE: ${{ runner.temp }}/security-scope.txt
        run: |
          set -euo pipefail
          # Full (non-shallow) fetch of the base so the merge-base exists; a
          # `--depth=1` fetch leaves no common ancestor and breaks the diff.
          git fetch --no-tags origin "$BASE_REF"

          # The decision lives in one script shared with scripts/rails/run-gates.sh —
          # it selects on what the diff CONTAINS, not only on folder names. The old
          # folder-only filter skipped six consecutive PRs that changed authorization,
          # tenant scoping and capability envelopes. See the script's header.
          # It exits non-zero when it cannot compute a diff, and `set -e` turns that
          # into a failed required check: unable-to-decide must never mean not-required.
          bash .github/scripts/security-gate-scope.sh --base FETCH_HEAD --format github > "$RUNNER_TEMP/scope.txt"
          cat "$RUNNER_TEMP/scope.txt"
          GATED="$(grep '^required=' "$RUNNER_TEMP/scope.txt" | cut -d= -f2)"
          echo "Files in scope:"; cat "$SECURITY_SCOPE_FILE" || true

          # Drafts are work-in-progress and cannot merge, so defer the expensive
          # (Opus) reviewer until the PR is marked ready — the `ready_for_review`
          # trigger re-runs this job. Unlike a job-level draft skip, short-circuiting
          # here keeps this REQUIRED check always reporting a conclusion (a trivial
          # pass on drafts), so the merge is never left stuck "pending".
          if [ "$IS_DRAFT" = "true" ]; then
            echo "review_required=false" >> "$GITHUB_OUTPUT"
            echo "Draft PR — security reviewer deferred until ready_for_review (check passes trivially)."
          elif [ "$GATED" = "true" ] || [ "$HAS_RISK_LABEL" = "true" ]; then
            echo "review_required=true" >> "$GITHUB_OUTPUT"
            echo "Security review REQUIRED (gated=$GATED, risk:high=$HAS_RISK_LABEL)."
          else
            echo "review_required=false" >> "$GITHUB_OUTPUT"
            echo "Nothing security-relevant in the diff and no risk:high label — security review not required."
          fi

      # Clear any verdict file that a PR may have COMMITTED into the tree. The
      # verdict must come from this run, not from attacker-supplied content; we
      # also write/read it under the runner temp dir (outside the workspace) so a
      # committed security-verdict.txt can never satisfy the gate.
      - name: Reset verdict
        if: steps.detect.outputs.review_required == 'true'
        run: rm -f "${{ runner.temp }}/security-verdict.txt" security-verdict.txt

      # Turn budget: a reviewer that exhausts --max-turns before writing its verdict
      # produces NO verdict, which the enforce step below can only treat as a block.
      # That made the gate least passable on the largest diffs — precisely when review
      # matters most. Two mitigations, and the first is the important one:
      #   1. The reviewer writes a PROVISIONAL BLOCK as its very first action, so an
      #      incomplete review fails closed by construction rather than by inference,
      #      and the reason line says so plainly.
      #   2. The budget is high enough for a genuinely large PR. Observed cost is
      #      ~$0.06/turn on opus, so this ceiling is ~$5 in the worst case — cheap
      #      against a security gate that silently stops working on big changes.
      - name: Run security-reviewer
        id: reviewer
        if: steps.detect.outputs.review_required == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            You are running as the security-reviewer for PR #${{ github.event.pull_request.number }}.

            STEP 1 — DO THIS FIRST, BEFORE READING ANYTHING ELSE.
            Write this exact two-line content to ${{ runner.temp }}/security-verdict.txt:

            SECURITY_VERDICT: BLOCK
            reason: PROVISIONAL - the review did not run to completion

            This is a fail-safe. If you run out of turns or error out later, that
            provisional block is what the gate sees, and it is the correct answer.
            Do not skip it and do not leave it until the end.

            STEP 2 — Review.
            Read the rubric at .github/security-review-rubric.md and follow it exactly.
            Review the PR diff (base is origin/${{ github.base_ref }}).
            ${{ runner.temp }}/security-scope.txt lists the files whose own changed lines
            carry a security signal — start there, then widen only if a finding leads you
            out of that set. Budget your turns: prefer a single `git diff` over many
            per-file reads, and do not re-read a file you have already seen.

            STEP 3 — Replace the verdict, and post findings.
            Overwrite ${{ runner.temp }}/security-verdict.txt with your real verdict.
            First line must be EXACTLY "SECURITY_VERDICT: PASS" or "SECURITY_VERDICT: BLOCK".
            On BLOCK, add a second line "reason: <one-line summary>" — never containing
            the word PROVISIONAL, which is reserved for the step-1 fail-safe.
            Also POST your findings as a PR comment.

            If you are running low on turns, STOP reviewing and do step 3 with the
            verdict you have. A completed BLOCK with a real reason is far more useful
            than an incomplete review that leaves the provisional block in place.
          claude_args: |
            --model opus
            --max-turns 80
            --allowedTools Bash,Read,Grep,Glob,Write,Edit

      - name: Enforce verdict (block on HIGH)
        if: steps.detect.outputs.review_required == 'true'
        env:
          VERDICT_FILE: ${{ runner.temp }}/security-verdict.txt
          # 'failure' here means the action itself errored (it runs with
          # continue-on-error so this step can classify the failure rather than
          # the job dying with no explanation). error_max_turns lands here too.
          REVIEWER_OUTCOME: ${{ steps.reviewer.outcome }}
        run: |
          set -euo pipefail
          # Every path here fails closed. The point of separating them is DIAGNOSIS:
          # "the reviewer found something", "the reviewer could not finish", and "the
          # reviewer never ran" demand completely different responses from a human,
          # and a single generic message sends people chasing the wrong cause.
          if [ ! -f "$VERDICT_FILE" ]; then
            echo "::error::Security review wrote no verdict at all — it failed before its first action. Failing closed."
            echo "This is an infrastructure fault, NOT a finding about this PR."
            echo "Reviewer step outcome: ${REVIEWER_OUTCOME}. Check the 'Run security-reviewer' step log."
            echo "Common causes: ANTHROPIC_API_KEY missing or invalid, the Claude GitHub App not installed, or the action failing to start (see .github/RAILS.md)."
            exit 1
          fi
          echo "Verdict file:"; cat "$VERDICT_FILE"
          # Exact prefix match on the first line — a model that buries the token in
          # prose, or attacker text like "PASS (1 BLOCK pending)", must not pass.
          FIRST="$(head -n1 "$VERDICT_FILE" || true)"
          REASON="$(sed -n '2p' "$VERDICT_FILE" || true)"
          case "$FIRST" in
            "SECURITY_VERDICT: BLOCK"*)
              # The reviewer writes a PROVISIONAL block first thing and overwrites it on
              # completion. Still provisional => it ran out of turns or errored mid-review.
              case "$REASON" in
                *PROVISIONAL*)
                  echo "::error::Security review did not run to completion — its provisional block was never replaced. Failing closed."
                  echo "This is NOT a finding about this PR. The reviewer started but did not finish."
                  echo "Reviewer step outcome: ${REVIEWER_OUTCOME}. If the step log ends in 'error_max_turns', the diff outgrew the turn budget — raise --max-turns or split the PR."
                  exit 1 ;;
              esac
              echo "::error::Security review found HIGH severity issue(s). Resolve them or record a named accepted-risk sign-off."
              echo "Reviewer reason: ${REASON}"
              exit 1 ;;
            "SECURITY_VERDICT: PASS"*)
              echo "Security review passed (no HIGH findings)."
              exit 0 ;;
            *)
              echo "::error::Unrecognized security verdict ('$FIRST'). Failing closed."
              exit 1 ;;
          esac

      - name: No review required
        if: steps.detect.outputs.review_required != 'true'
        run: echo "Nothing security-relevant changed (no gated path, no security signal in the diff) — security-review check passes trivially."
