name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Provision Postgres so the Infrastructure.Observability integration tests actually
    # execute instead of skipping. The credentials and database name match the fixture's
    # DefaultConnectionString (Database/Username/Password = "observability"). Setting
    # OBSERVABILITY_TEST_CONN below also flips the fixture into "explicitly configured"
    # mode, so any connectivity failure surfaces as a hard error rather than a silent skip.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: observability
          POSTGRES_USER: observability
          POSTGRES_PASSWORD: observability
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U observability -d observability"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      OBSERVABILITY_TEST_CONN: "Host=localhost;Port=5432;Database=observability;Username=observability;Password=observability"

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      # No schema step. There used to be one here that replayed Dashboards/init-db/*.sql through
      # psql, and it is the reason #301 stayed invisible for as long as it did: it rebuilt the
      # schema from scratch on a fresh database every run, so CI could prove a schema change worked
      # for a new installation while nothing on earth could deliver that change to a database that
      # already held data.
      #
      # PostgresFixture now applies the real migration runner instead, which means every CI run
      # exercises the actual delivery path rather than a parallel one that only CI ever used.
      - name: Restore
        run: dotnet restore src/AgenticHarness.slnx

      - name: Build
        run: dotnet build src/AgenticHarness.slnx --no-restore --configuration Release

      # owasp-agentic-gate (below, needs: build-and-test) used to run its own dotnet restore +
      # dotnet build --configuration Release from scratch before this step existed — a second
      # full-solution build in sequence on every PR, purely to run one project's filtered test
      # subset with a build it already has sitting in this job's workspace. Uploading the exact
      # output lets that gate skip straight to `dotnet test --no-build`.
      #
      # Both bin/ and obj/ are included, not just bin/ — obj/ carries project.assets.json and
      # the source-generator output some projects need even under --no-build, and a narrower
      # glob risks silently missing one of them on a project that happens to use one.
      - name: Upload build output for owasp-agentic-gate
        uses: actions/upload-artifact@v7
        with:
          name: release-build-output
          path: |
            src/**/bin/Release/**
            src/**/obj/**
          retention-days: 1
          if-no-files-found: error

      # Output is tee'd to a file so the step below can explain a failure the summary lines hide.
      # `set -o pipefail` is what stops tee from swallowing dotnet's exit code — without it this
      # step reports success whenever the tests fail, which is the opposite of a gate.
      - name: Unit and integration tests
        id: tests
        run: |
          set -euo pipefail
          dotnet test src/AgenticHarness.slnx \
            --no-build \
            --configuration Release \
            --collect:"XPlat Code Coverage" \
            --results-directory coverage 2>&1 | tee test-output.log

      # Says nothing unless the failure was the runner crashing rather than a test failing. See the
      # script for what that failure looks like and why it is worth a step of its own.
      #
      # Conditioned on the tests step rather than a bare failure(), so a Build or schema failure does
      # not send it looking at a file that was never written.
      - name: Explain a test-runner crash
        if: steps.tests.outcome == 'failure'
        run: .github/scripts/explain-runner-crash.sh test-output.log

      # The log outlives the workspace on purpose. This crash took one occurrence in four runs to
      # appear and could not be reproduced, so the run that catches it next is the only evidence
      # there will be — and a 60-line excerpt in a job summary is not enough to diagnose from.
      - name: Upload test output
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-output
          path: test-output.log
          if-no-files-found: ignore

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/

  # Until this job existed, NOTHING in CI ran npm: not a build, not a test, not a lint.
  # The two frontends carry 527 passing tests (Dashboard 385 in 52 files, WebUI 142 in 26)
  # that no pipeline had ever executed, and 175 tracked .tsx files that reached main on the
  # strength of local runs alone. This job is the first leg — tests only, and blocking from
  # the day it lands because both suites are already green.
  #
  # All three legs are now here and all three block: tests (#229), typecheck (#230), lint.
  # Each arrived only once it was green, because a step that runs without failing the build is
  # not a gate — this repo has already paid for that lesson twice in the security gate.
  #
  # No `paths:` filter, on purpose. A job that only sometimes runs is the same trap one
  # level up, and these two suites finish in well under the .NET job's five minutes, so
  # they cost no wall-clock — they run alongside it, not after it.
  frontend-tests:
    name: frontend (${{ matrix.project }})
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      # Report both frontends on every run. With fail-fast, a Dashboard failure would
      # cancel the WebUI job and hide whether that one was broken too, turning two
      # independent signals into one.
      fail-fast: false
      matrix:
        project: [ Presentation.Dashboard, Presentation.WebUI ]

    defaults:
      run:
        working-directory: src/Content/Presentation/${{ matrix.project }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          # Matches dependency-audit.yml. Both package.json files require >=20.18.1.
          node-version: '22'
          cache: npm
          cache-dependency-path: src/Content/Presentation/${{ matrix.project }}/package-lock.json

      # `npm ci` rather than `npm install`: it installs exactly the tracked lockfile and
      # fails if package.json and package-lock.json disagree, so a hand-edited dependency
      # cannot pass CI while resolving to something else on a developer's machine.
      - name: Install
        run: npm ci

      # `tsc -b`, not `tsc --noEmit`. The root tsconfig is `files: []` plus project
      # references, and plain --noEmit does not follow references — so the old build step
      # compiled zero files and exited 0 while every source file went unchecked. Build mode
      # walks the app, node and test projects.
      - name: Typecheck
        run: npm run typecheck

      # `--max-warnings 0` is deliberately NOT set. Both projects carry warnings that are
      # advisory by design — React Compiler's "incompatible library" note on react-hook-form's
      # watch(), and two exhaustive-deps hints — and failing on them would either force a
      # suppression or block on someone else's library. Errors block; warnings inform.
      - name: Lint
        if: '!cancelled()'
        run: npm run lint

      # Runs even when an earlier check fails, so one CI run reports every signal instead of
      # hiding the rest behind the first red step.
      - name: Tests
        if: '!cancelled()'
        run: npm run test

  owasp-agentic-gate:
    name: OWASP Agentic Top-10 Gate
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      # Reuses build-and-test's own Release build instead of restoring and building the whole
      # solution again — see the matching upload step's comment in that job. This job still needs
      # its own checkout (for the source files dotnet test discovers tests from, and for
      # explain-runner-crash.sh below) — only the restore/build work is skipped.
      - name: Download build output from build-and-test
        uses: actions/download-artifact@v7
        with:
          name: release-build-output
          path: .

      - name: Run OWASP Agentic eval fixtures (hard gate)
        id: owasp-tests
        # Any Verdict.Fail causes a non-zero exit code and blocks the merge.
        # To document a legitimate bypass, add an entry to .github/eval-bypasses.md
        # with the case id, reason, and expiry date — but the gate still runs.
        #
        # Tee'd like the main test job, and for the same reason: this step asks for a TRX log, which
        # records per-test source file and line, so it engages the same symbol-reading path the
        # runner has crashed in (issue #263). A gate that can go red with every test passing is worth
        # six lines to explain wherever it can happen — not just where it happened first.
        run: |
          set -euo pipefail
          dotnet test \
            src/Content/Tests/Application.AI.Common.Tests/Application.AI.Common.Tests.csproj \
            --no-build \
            --configuration Release \
            --filter "Category=OwaspAgentic" \
            --logger "trx;LogFileName=owasp-agentic-gate.trx" \
            --results-directory owasp-results 2>&1 | tee owasp-test-output.log

      - name: Explain a test-runner crash
        if: steps.owasp-tests.outcome == 'failure'
        run: .github/scripts/explain-runner-crash.sh owasp-test-output.log

      - name: Upload OWASP gate results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: owasp-agentic-gate-results
          path: owasp-results/
