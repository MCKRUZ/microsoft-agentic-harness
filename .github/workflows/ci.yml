name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Provision Postgres so the Infrastructure.Observability integration tests actually
    # execute instead of skipping. The credentials and database name match the fixture's
    # DefaultConnectionString (Database/Username/Password = "observability"). Setting
    # OBSERVABILITY_TEST_CONN below also flips the fixture into "explicitly configured"
    # mode, so any connectivity failure surfaces as a hard error rather than a silent skip.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: observability
          POSTGRES_USER: observability
          POSTGRES_PASSWORD: observability
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U observability -d observability"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      OBSERVABILITY_TEST_CONN: "Host=localhost;Port=5432;Database=observability;Username=observability;Password=observability"

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      # The schema scripts are normally applied by docker-entrypoint-initdb.d, which is
      # unavailable to GitHub Actions service containers. Apply them in lexical order via
      # psql once the service is healthy so the observability tables exist before tests run.
      - name: Apply observability schema
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          for f in Dashboards/init-db/*.sql; do
            echo "Applying $f"
            PGPASSWORD=observability psql -h localhost -p 5432 -U observability -d observability -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Restore
        run: dotnet restore src/AgenticHarness.slnx

      - name: Build
        run: dotnet build src/AgenticHarness.slnx --no-restore --configuration Release

      - name: Unit and integration tests
        run: >
          dotnet test src/AgenticHarness.slnx
          --no-build
          --configuration Release
          --collect:"XPlat Code Coverage"
          --results-directory coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/

  # Until this job existed, NOTHING in CI ran npm: not a build, not a test, not a lint.
  # The two frontends carry 527 passing tests (Dashboard 385 in 52 files, WebUI 142 in 26)
  # that no pipeline had ever executed, and 175 tracked .tsx files that reached main on the
  # strength of local runs alone. This job is the first leg — tests only, and blocking from
  # the day it lands because both suites are already green.
  #
  # Typecheck and lint are deliberately NOT here yet. Both are currently red (39 production
  # type errors across the two projects, 44 lint errors), and a step that runs without
  # failing the build is not a gate — this repo has already paid for that lesson twice in
  # the security gate. They arrive in their own PRs, each blocking on arrival, once the
  # errors they would report are fixed.
  #
  # No `paths:` filter, on purpose. A job that only sometimes runs is the same trap one
  # level up, and these two suites finish in well under the .NET job's five minutes, so
  # they cost no wall-clock — they run alongside it, not after it.
  frontend-tests:
    name: frontend tests (${{ matrix.project }})
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      # Report both frontends on every run. With fail-fast, a Dashboard failure would
      # cancel the WebUI job and hide whether that one was broken too, turning two
      # independent signals into one.
      fail-fast: false
      matrix:
        project: [ Presentation.Dashboard, Presentation.WebUI ]

    defaults:
      run:
        working-directory: src/Content/Presentation/${{ matrix.project }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          # Matches dependency-audit.yml. Both package.json files require >=20.18.1.
          node-version: '22'
          cache: npm
          cache-dependency-path: src/Content/Presentation/${{ matrix.project }}/package-lock.json

      # `npm ci` rather than `npm install`: it installs exactly the tracked lockfile and
      # fails if package.json and package-lock.json disagree, so a hand-edited dependency
      # cannot pass CI while resolving to something else on a developer's machine.
      - name: Install
        run: npm ci

      - name: Tests
        run: npm run test

  owasp-agentic-gate:
    name: OWASP Agentic Top-10 Gate
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore src/AgenticHarness.slnx

      - name: Build
        run: dotnet build src/AgenticHarness.slnx --no-restore --configuration Release

      - name: Run OWASP Agentic eval fixtures (hard gate)
        # Any Verdict.Fail causes a non-zero exit code and blocks the merge.
        # To document a legitimate bypass, add an entry to .github/eval-bypasses.md
        # with the case id, reason, and expiry date — but the gate still runs.
        run: >
          dotnet test
          src/Content/Tests/Application.AI.Common.Tests/Application.AI.Common.Tests.csproj
          --no-build
          --configuration Release
          --filter "Category=OwaspAgentic"
          --logger "trx;LogFileName=owasp-agentic-gate.trx"
          --results-directory owasp-results

      - name: Upload OWASP gate results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: owasp-agentic-gate-results
          path: owasp-results/
